name: Deploy to Staging

on:
  push:
    branches: [develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npm run lint
      - run: cd backend && npm run test

  test-frontend-subscriber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-subscriber/package-lock.json
      - run: cd frontend-subscriber && npm ci
      - run: cd frontend-subscriber && npm run build

  test-frontend-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json
      - run: cd frontend-admin && npm ci
      - run: cd frontend-admin && npm run build

  deploy:
    needs: [test-backend, test-frontend-subscriber, test-frontend-admin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
      - name: Deploy to staging
        run: echo "Deploy to staging environment"
