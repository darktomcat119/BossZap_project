version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bosszap-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bosszap}
      POSTGRES_USER: ${POSTGRES_USER:-bosszap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bosszap}']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: bosszap-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: bosszap-backend
    restart: always
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bosszap}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bosszap}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M

  frontend-subscriber:
    build:
      context: ./frontend-subscriber
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-bosszap.com}
        NEXT_PUBLIC_WS_URL: https://api.${DOMAIN:-bosszap.com}
    container_name: bosszap-app
    restart: always
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-bosszap.com}
      NEXT_PUBLIC_WS_URL: https://api.${DOMAIN:-bosszap.com}
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 384M

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-bosszap.com}
        NEXT_PUBLIC_WS_URL: https://api.${DOMAIN:-bosszap.com}
    container_name: bosszap-admin
    restart: always
    ports:
      - '127.0.0.1:3002:3000'
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-bosszap.com}
      NEXT_PUBLIC_WS_URL: https://api.${DOMAIN:-bosszap.com}
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 384M

  landing-page:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-bosszap.com}
        NEXT_PUBLIC_APP_URL: https://app.${DOMAIN:-bosszap.com}
    container_name: bosszap-landing
    restart: always
    ports:
      - '127.0.0.1:3003:3000'
    environment:
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN:-bosszap.com}
      NEXT_PUBLIC_APP_URL: https://app.${DOMAIN:-bosszap.com}
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
